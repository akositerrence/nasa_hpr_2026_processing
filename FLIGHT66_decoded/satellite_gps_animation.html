<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Satellite GPS Animation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .control-panel {
            position: absolute;
            left: 16px;
            bottom: 18px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            min-width: 330px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            font-size: 14px;
            padding: 6px 10px;
            cursor: pointer;
        }

        #slider {
            width: 230px;
        }

        .readout {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.35;
        }

        .legend {
            position: absolute;
            right: 16px;
            bottom: 18px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            font-size: 13px;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 6px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .rocket-marker {
            width: 20px;
            height: 20px;
            background: #ff7a00;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>

    <div id="map"></div>

    <div class="legend">

    </div>

        }).addTo(map);

        const slider = document.getElementById('slider');
        const playPause = document.getElementById('playPause');
        const restart = document.getElementById('restart');
        const timeReadout = document.getElementById('timeReadout');
        const latlonReadout = document.getElementById('latlonReadout');
        const frameReadout = document.getElementById('frameReadout');

        let frame = 0;
        let playing = true;
        let lastTick = performance.now();

        function updateFrame(i) {
            frame = Math.max(0, Math.min(points.length - 1, i));

            const p = points[frame];
            rocket.setLatLng(p);

            slider.value = frame;
            timeReadout.textContent = times[frame].toFixed(2);
            latlonReadout.textContent = p[0].toFixed(8) + ', ' + p[1].toFixed(8);
            frameReadout.textContent = frame.toString();
        }

        function stepAnimation(now) {
            if (playing && now - lastTick >= 50) {
                lastTick = now;

                let nextFrame = frame + Math.max(1, Math.round(1.0));

                if (nextFrame >= points.length) {
                    nextFrame = 0;
                }

                updateFrame(nextFrame);
            }

            requestAnimationFrame(stepAnimation);
        }

        playPause.addEventListener('click', () => {
            playing = !playing;
            playPause.textContent = playing ? 'Pause' : 'Play';
        });

        restart.addEventListener('click', () => {
            updateFrame(0);
            playing = true;
            playPause.textContent = 'Pause';
        });

        slider.addEventListener('input', () => {
            playing = false;
            playPause.textContent = 'Play';
            updateFrame(parseInt(slider.value));
        });

        updateFrame(0);
        requestAnimationFrame(stepAnimation);
    </script>
